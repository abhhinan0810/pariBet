<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2180 730" width="2180" height="730" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>pariBET logo</title>
  <defs>
    <!-- Base horizontal gold gradient across the whole wordmark -->
    <linearGradient id="goldH" gradientUnits="userSpaceOnUse" x1="240" y1="0" x2="2083" y2="0">
      <stop offset="0" stop-color="#dc9a3a"/>
      <stop offset="0.18" stop-color="#f4c25c"/>
      <stop offset="0.35" stop-color="#f7cf72"/>
      <stop offset="0.5" stop-color="#fff0c2"/>
      <stop offset="0.62" stop-color="#fbe19a"/>
      <stop offset="0.8" stop-color="#f1bf58"/>
      <stop offset="1" stop-color="#d9993a"/>
    </linearGradient>
    <!-- Vertical shading overlay: highlight on top, warm shadow at the bottom -->
    <linearGradient id="shadeV" gradientUnits="userSpaceOnUse" x1="0" y1="178" x2="0" y2="580">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#a8651a" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8a4f12" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="triangle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0b050"/>
      <stop offset="0.55" stop-color="#d78a33"/>
      <stop offset="1" stop-color="#b46a22"/>
    </linearGradient>
    <radialGradient id="dot" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#fff6d6"/>
      <stop offset="0.6" stop-color="#fbe3a0"/>
      <stop offset="1" stop-color="#eebd5c"/>
    </radialGradient>

    <!-- Letter shapes -->
    <path id="p" fill-rule="evenodd" d="M305 258 L388 258 L382 296 C420 256 480 246 522 262 C562 280 576 332 560 388 C545 446 492 487 424 487 C384 487 356 478 340 460 L330 574 L240 576 Z M365 372 C372 330 405 312 440 314 C470 316 479 346 470 376 C460 410 430 425 405 425 C375 425 360 402 365 372 Z"/>
    <path id="a" fill-rule="evenodd" d="M597 290 C625 262 680 250 725 256 C775 262 792 292 782 342 L766 422 L750 487 L703 487 L710 470 C680 488 630 492 595 480 C560 468 548 430 565 405 C585 380 625 372 665 368 L720 362 C725 330 700 318 670 320 C640 322 615 335 605 345 Z M640 430 C640 415 665 400 718 396 L712 420 C705 435 680 438 660 438 C645 438 638 436 640 430 Z"/>
    <path id="r" d="M842 262 L930 262 L925 290 C950 262 985 255 1017 258 L1005 330 C985 325 960 330 945 345 C930 360 925 385 920 410 L890 487 L808 487 Z"/>
    <path id="i" d="M1030 258 L1118 258 L1070 487 L985 487 Z"/>
    <path id="B" fill-rule="evenodd" d="M1172 180 L1380 180 C1440 180 1460 215 1452 255 C1445 290 1420 315 1395 322 C1430 330 1445 360 1438 395 C1428 450 1390 487 1330 487 L1105 487 Z M1240 245 L1335 245 C1360 245 1368 260 1365 275 C1360 295 1345 300 1325 300 L1228 300 Z M1222 365 L1345 365 C1370 365 1378 385 1372 400 C1366 418 1350 422 1330 422 L1210 422 Z"/>
    <path id="E" d="M1510 180 L1768 180 L1758 255 L1580 255 L1572 302 L1730 302 L1722 360 L1560 360 L1548 418 L1728 418 L1718 487 L1442 487 Z"/>
    <path id="T" d="M1790 180 L2083 180 L2068 255 L1956 255 L1905 487 L1815 487 L1866 255 L1768 255 Z"/>
    <circle id="dotShape" cx="1085" cy="203" r="46"/>

    <g id="letters">
      <use href="#p"/><use href="#a"/><use href="#r"/><use href="#i"/>
      <use href="#B"/><use href="#E"/><use href="#T"/>
    </g>
  </defs>

  <!-- Left arrow / triangle mark -->
  <path d="M113 357 L270 360 L243 487 Z" fill="url(#triangle)" stroke="#6b3d0f" stroke-width="5" stroke-linejoin="round"/>
  <path d="M120 362 L262 364 L241 470 Z" fill="none" stroke="#f3c266" stroke-width="2" stroke-linejoin="round" opacity="0.8"/>

  <!-- Dark outline -->
  <g fill="none" stroke="#4a2c08" stroke-width="9" stroke-linejoin="round">
    <use href="#letters"/>
    <use href="#dotShape"/>
  </g>

  <!-- Gold fill -->
  <g fill="url(#goldH)">
    <use href="#letters"/>
  </g>
  <use href="#dotShape" fill="url(#dot)"/>

  <!-- Vertical shading -->
  <g fill="url(#shadeV)">
    <use href="#letters"/>
  </g>

  <!-- Bevel highlight line -->
  <g fill="none" stroke="#ffe7a3" stroke-width="2.5" stroke-linejoin="round" opacity="0.9">
    <use href="#letters"/>
    <use href="#dotShape"/>
  </g>
</svg>
